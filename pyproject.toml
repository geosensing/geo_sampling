[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[project]
name = "geo-sampling"
version = "0.3.0"
description = "Extract and sample road segments from OpenStreetMap data for geographic analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com"},
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["geo", "street", "road", "openstreetmap", "osm", "city"]
dependencies = [
    "pyshp>=2.3.1",
    "matplotlib>=3.5.0",
    "pyproj>=3.3.0",
    "Shapely>=2.0.0",
    "utm>=0.7.0",
    "beautifulsoup4>=4.10.0",
    "requests>=2.32.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = ["check-manifest"]
test = ["coverage", "pytest"]
docs = ["sphinx>=4.0", "furo"]

[project.urls]
Homepage = "https://github.com/geosensing/geo_sampling"
Repository = "https://github.com/geosensing/geo_sampling"

[project.scripts]
geo-sampling = "geo_sampling.cli:cli"


[tool.uv.build-backend]
module-name = "geo_sampling"
module-root = ""

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.7.0", "mypy>=1.0", "pre-commit>=3.0.0"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = [
    "sphinx>=4.0",
    "furo",
    "myst-parser>=0.18",
    "linkify-it-py>=2.0.0",
    "sphinx-design>=0.5.0",
    "sphinx-copybutton>=0.5.0"
]
