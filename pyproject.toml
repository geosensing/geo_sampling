[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[project]
name = "geo-sampling"
version = "0.3.1"
description = "Extract and sample road segments from OpenStreetMap data for geographic analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com"},
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["geo", "street", "road", "openstreetmap", "osm", "city"]
dependencies = [
    "pyshp>=2.3.1",
    "matplotlib>=3.5.0",
    "pyproj>=3.3.0",
    "Shapely>=2.0.0",
    "utm>=0.7.0",
    "beautifulsoup4>=4.10.0",
    "requests>=2.32.0",
    "click>=8.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["check-manifest"]
test = ["coverage", "pytest"]
docs = ["sphinx>=4.0", "furo"]

[project.urls]
Homepage = "https://github.com/geosensing/geo-sampling"
Repository = "https://github.com/geosensing/geo-sampling"
Documentation = "https://geosensing.github.io/geo-sampling/"
Changelog = "https://github.com/geosensing/geo-sampling/blob/public/CHANGELOG.md"
Issues = "https://github.com/geosensing/geo-sampling/issues"
Discussions = "https://github.com/geosensing/geo-sampling/discussions"

[project.scripts]
geo-sampling = "geo_sampling.cli:cli"


[tool.uv.build-backend]
module-name = "geo_sampling"
module-root = ""

[dependency-groups]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.7.0", "mypy>=1.0", "pre-commit>=3.0.0"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = [
    "sphinx>=4.0",
    "furo",
    "myst-parser>=0.18",
    "linkify-it-py>=2.0.0",
    "sphinx-design>=0.5.0",
    "sphinx-copybutton>=0.5.0"
]

[tool.deptry]
extend_exclude = ["docs", "tests", "examples", "scripts"]
ignore_notebooks = true

[tool.deptry.package_module_name_map]
beautifulsoup4 = "bs4"
check-manifest = "check_manifest"
linkify-it-py = "linkify_it"

[tool.deptry.per_rule_ignores]
DEP002 = ["check-manifest", "coverage", "pytest", "sphinx", "furo"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=geo_sampling",
    "--cov-report=term-missing:skip-covered",
]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning:matplotlib.*",
    "ignore::UserWarning:geo_sampling.visualization",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests as requiring network access",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "shapefile.*",
    "utm.*",
    "pyproj.*",
    "bs4.*",
]
ignore_missing_imports = true
